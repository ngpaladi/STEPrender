<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>STEP/STL Viewer</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpolygon points='16,3 29,10 29,22 16,29 3,22 3,10' fill='%235b8cff'/%3E%3Cpolygon points='16,3 29,10 16,17 3,10' fill='%238fb3d9'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <div class="brand">STEP / STL Viewer</div>
        <div class="topbar-actions">
          <label class="btn" for="file-input">Add File(s)</label>
          <input id="file-input" type="file" accept=".step,.stp,.stl" multiple hidden />
          <button id="reset-colors-btn" class="btn" disabled>Reset Colors</button>
          <button id="export-btn" class="btn" disabled>Export GLB</button>
          <button id="clear-scene-btn" class="btn" disabled>Clear Scene</button>
        </div>
      </header>

      <main id="main">
        <div id="viewport-wrap">
          <canvas id="viewport"></canvas>
          <div id="dropzone">
            <div id="dropzone-inner">
              <p class="dz-title">Drop STEP or STL files here</p>
              <p class="dz-sub">.step &middot; .stp &middot; .stl &mdash; drop several at once to assemble them</p>
            </div>
          </div>
          <div id="loading-overlay" class="hidden">
            <div class="spinner"></div>
            <div id="loading-text">Loading…</div>
          </div>
          <div id="hint">Click any surface to recolor it &middot; add more files to build up an assembly</div>
        </div>

        <aside id="sidebar">
          <div id="model-info" class="panel">
            <p class="empty-msg">No model loaded yet.</p>
          </div>
          <div id="surface-list" class="panel"></div>
        </aside>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
